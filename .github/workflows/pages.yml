name: Validate and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Validate JavaScript and public assets
        run: |
          node --check app.js
          test -s index.html
          test -s styles.css
          test -s assets/portrait.png
          test -s assets/Atikul_Gazi_Resume.pdf
          test -s assets/favicon.svg
      - name: Stage public files only
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
